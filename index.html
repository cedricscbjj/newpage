<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Projet Image Map</title>
    <style>

@import url('https://fonts.googleapis.com/css2?family=Cousine:ital,wght@0,400;0,700;1,400;1,700&family=Rammetto+One&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&display=swap');



:root {
    --bg-color: #f4f4f4;
    --hover-effect: brightness(1.2);
}

body {
    margin: 0;
    /*background-color: var(--bg-color);*/
      font-family: "Google Sans Code", monospace;
      background-color: antiquewhite;

}

/* HEADER */

.header {
    text-align: center;
    padding: 2rem 1rem;
}

/* GRID PRINCIPALE */

.image-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    width: 100%;
    max-width: 1200px;
    margin: auto;
}

/* STYLE COMMUN À TOUTES LES IMAGES */

.img {
    width: 100%;
    aspect-ratio: 16 / 9;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
}

/* IMAGES */

.img1 { background-image: url("image1.png"); }
.img2 { background-image: url("image2.png"); }
.img3 { background-image: url("image3.png"); }
.img4 { background-image: url("image4.png"); }
.img5 { background-image: url("image5.png"); }
.img6 { background-image: url("image6.png"); }
.img7 { background-image: url("image7.png"); }
.img8 { background-image: url("image8.png"); }
.img9 { background-image: url("image9.png"); }

/* HOVER uniquement sur les liens */

a.img {
    cursor: pointer;
    transition: 0.3s ease;
}

a.img:hover {
     filter: invert(20%) sepia(100%) saturate(500%) hue-rotate(180deg) brightness(1.3);

}

/* FOOTER */

.footer {
    text-align: center;
    padding: 2rem 1rem;
}

/* RESPONSIVE */

@media (min-width: 900px) {
    .image-grid {
        width: 70vw;
    }
}

/* CONTENEUR */
.request {
    width: 100%;
    max-width: 500px;
    margin: 1rem auto;
    padding: 0 1rem;
    box-sizing: border-box;
}

/* INPUT */
.request input {
    width: 100%;
    padding: 14px 16px;
    font-size: clamp(14px, 4vw, 16px);
    font-family: "Google Sans Code", monospace;

    background: transparent;
    color: #86d4d5;

    border: 2px solid #86d4d5;
    border-radius: 10px;

    outline: none;
    box-sizing: border-box;

    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

/* Placeholder lisible */
.request input::placeholder {
    color: #86d4d5;
    opacity: 0.7;
}

/* Focus propre */
.request input:focus {
    border-color: #5bbcbc;
    box-shadow: 0 0 0 3px rgba(134, 212, 213, 0.2);
}








.bonjour-img {
    width: 90%;
    max-width: 442px; /* taille max originale */
    height: auto;
    display: block;
    margin: 0 auto 1rem auto;
  transition: 0.2s;

}

.bonjour-img:hover {
  animation: glitchRGB 0.2s infinite;
  cursor: pointer;
}

@keyframes glitchRGB {
  0% {
    filter: drop-shadow(-2px 0 red)
            drop-shadow(2px 0 blue);
  }
  50% {
    filter: drop-shadow(2px 0 red)
            drop-shadow(-2px 0 blue);
  }
  100% {
    filter: drop-shadow(-2px 0 red)
            drop-shadow(2px 0 blue);
  }
}

.rollinghead {
  cursor: url("NO.png") 0 0, pointer;
}



/* ===== TV CONTAINER ===== */
.tv {
    position: relative;
    width: min(90vw, 520px);
    aspect-ratio: 16 / 10;
    background: #86d4d5;
    border-radius: 20px;
    padding: clamp(10px, 3vw, 20px);
    box-shadow: 
        inset 0 0 20px rgba(0,0,0,0.6),
        0 20px 40px rgba(0,0,0,0.8);
    display: flex;

      margin: 0 auto;

  
}

/* ===== ECRAN ===== */
.screen {
    position: relative;
    flex: 1;
    background: black;
    border-radius: 10px;
    overflow: hidden;
    padding: clamp(10px, 3vw, 20px);
    color: #00ff66;
    font-family: monospace;
    font-size: clamp(14px, 2.5vw, 18px);
    line-height: 1.4;
    text-shadow: 0 0 5px #00ff66;
}

/* CRT scanlines */
.screen::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.05) 0px,
        rgba(0,0,0,0.25) 2px,
        rgba(0,0,0,0.25) 4px
    );
    pointer-events: none;
}

/* CRT flicker */
.screen::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.02);
    animation: flicker 0.15s infinite;
    pointer-events: none;
}

@keyframes flicker {
    0% { opacity: 0.04; }
    50% { opacity: 0.02; }
    100% { opacity: 0.04; }
}

.tv-text {
    position: relative;
    z-index: 2;
    word-wrap: break-word;
    overflow-wrap: break-word;
}

/* ===== CONTROLS ===== */
.controls {
    width: clamp(40px, 10vw, 60px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(10px, 3vw, 20px);
    margin-left: clamp(8px, 2vw, 15px);
}

.button {
    width: clamp(28px, 7vw, 40px);
    height: clamp(28px, 7vw, 40px);
    background: red;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: inset 0 4px 6px rgba(0,0,0,0.5);
    transition: transform 0.1s;
}

.button:active {
    transform: scale(0.9);
}

/* ===== MOBILE ADJUSTMENTS ===== */
@media (max-width: 480px) {
    .tv {
        border-radius: 14px;
    }

    .screen {
        text-shadow: 0 0 3px #00ff66;
        font-size: 6vw;

    }
}

</style>
</head>

<body>

<header class="header">

<img src="BONJOUR.png" alt="salutations" class="bonjour-img" />

<div class="tv"> 
    <div class="screen">
        <div class="tv-text" id="tvText">
            
        </div>


    </div>

    <div class="controls">
        <div class="button" onclick="changeText()"></div>
        <div class="button" onclick="clearText()"></div>
    </div>
</div>
<br><br><br>
       <div class="request"> <input type="text" placeholder="Type anything"  id="userInput" > </div>
</header>






<nav class="image-grid">

    <a href="page1.html" class="img img1"></a>
    <div class="img img2"></div>
    <a href="page3.html" class="img img3"></a>

    <div class="img img4"></div>
    <a href="page5.html" class="img img5"></a>
    <div class="img img6"></div>

    <a href="page7.html" class="img img7"></a>
    <div class="img img8"></div>
    <a href="page9.html" class="img img9"></a>

</nav>

<footer class="footer">

    <img src="3dgifmaker24590.gif" id="triggerImage" alt="salutations"  height="242" width="242" class="rollinghead"    />

<p id="hola">made with lots of love by pilito - credits - say hi @ holapilito [at] gmail [dot] com

 </p>
    <p>© 2026 Mon Projet</p>
</footer>

<script>

    const input = document.querySelector("#userInput");
    const output = document.querySelector("#tvText");

    const rules = [
      {
        pattern: /bonjour|salut|hello/i,
        response: "Bonjour à vous aussi."
      },
      {
        pattern: /comment ça va|la forme/i,
        response: "Je fonctionne correctement. Merci de vous en inquiéter."
      },
      {
        pattern: /ton nom/i,
        response: "Je suis une entité JavaScript. Rien de mystique."
      },
      {
        pattern: /.*/,
        response: "Je n'ai pas encore de réponse pour ça."
      }
    ];

    input.addEventListener("input", (e) => {
      const value = e.target.value.trim();
      const match = rules.find(rule => rule.pattern.test(value));
      output.textContent = match.response;
    });

function changeText() {
    document.getElementById("tvText").innerText = 
    "Signal détecté...\nConnexion établie.\nBienvenue dans le système.";
}

function clearText() {
    document.getElementById("tvText").innerText = "";
}




const img = document.getElementById("triggerImage");

img.addEventListener("click", function() {

    // changer texte
    //document.getElementById("title").textContent = "Nouveau titre";

    // changer paragraphe
    document.getElementById("hola").textContent = "Le texte a été modifié";

    // changer image
    document.querySelector(".img7").style.backgroundImage = "url('dinosaur.png')";

    // changer background
    document.body.style.backgroundColor = "black";
    var els = document.getElementById ("hola");
    els.style.color = "white";

});



</script>
<script src="scriptbot.js"></script>
<script src="scriptdestroy.js"></script>

</body>
</html>
